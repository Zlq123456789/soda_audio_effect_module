<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汽水音乐 9大官方音效 DSP 独立演示系统 (100% 官方原版)</title>
  <style>
    :root {
      --bg-main: #0f0f11;
      --card-bg: #18181b;
      --card-border: #27272a;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --accent: #38bdf8;
      --text: #f4f4f5;
      --text-dim: #a1a1aa;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      padding: 24px 16px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 920px;
    }
    .header {
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 6px 0;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #000;
      font-weight: 700;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 13px;
      margin: 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .card h3 {
      margin: 0 0 14px 0;
      font-size: 16px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .effect-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .effect-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .effect-item.active {
      background: rgba(245, 158, 11, 0.12);
      border-color: var(--primary);
    }
    .effect-item.active::after {
      content: '✓';
      position: absolute;
      right: 12px;
      top: 12px;
      color: var(--primary);
      font-weight: bold;
    }
    .effect-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .effect-desc {
      font-size: 12px;
      color: var(--text-dim);
    }
    .btn {
      background: var(--primary);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #27272a;
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover { background: #3f3f46; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .file-upload-btn {
      position: relative;
      overflow: hidden;
    }
    .file-upload-btn input[type=file] {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .player-panel {
      margin-top: 14px;
      background: #121214;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-bar {
      flex: 1;
      height: 6px;
      background: #27272a;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      width: 0%;
    }
    .time-text {
      font-size: 12px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    canvas {
      width: 100%;
      height: 70px;
      background: #09090b;
      border-radius: 6px;
      margin-top: 8px;
    }
    #log {
      background: #09090b;
      color: var(--success);
      font-family: Consolas, monospace;
      padding: 12px;
      border-radius: 6px;
      height: 140px;
      overflow-y: auto;
      font-size: 12px;
      white-space: pre-wrap;
      border: 1px solid var(--card-border);
    }
  </style>
</head>

      `;

      grid.appendChild(item);
    });

    // 动态重构音频路由
    function rebuildAudioRouting() {
      if (!sourceNode || !audioCtx) return;

      try { sourceNode.disconnect(); } catch(e){}
      if (workletNode) {
        try { workletNode.disconnect(); } catch(e){}
      }

      if (currentKey === 'none' || !PRESETS[currentKey] || !workletReady) {
        sourceNode.connect(analyserNode);
        analyserNode.connect(audioCtx.destination);
      } else {
        sourceNode.connect(workletNode);
        workletNode.connect(analyserNode);
        analyserNode.connect(audioCtx.destination);
      }
    }

    // 初始化 AudioContext 与 AudioWorklet
    async function initAudioGraph() {
      if (workletReady) return;
      if (initPromise) return await initPromise;

      initPromise = (async () => {
        if (!wasmBinary) {
          await initResources();
        }

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        if (!analyserNode) {
          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 128;
        }

        if (!workletNode) {
          log('🚀 正在挂载 AudioWorklet 实时音频渲染模块...');
          await audioCtx.audioWorklet.addModule('./worklet_bundle.js');
          workletNode = new AudioWorkletNode(audioCtx, 'soda-audio-effect-processor', {
            numberOfInputs: 1,
            numberOfOutputs: 1,
          });

          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error('AudioWorklet 初始化超时')), 8000);
            workletNode.port.onmessage = (e) => {
              if (e.data.type === 'ready') {
                clearTimeout(timer);
                workletReady = true;
                log('✅ AudioWorklet 实时音频渲染线程就绪 (0延迟 / 0丢帧 / 0杂音)');
                resolve();
              } else if (e.data.type === 'configLoaded') {
                log('🎛️ DSP 核心已成功载入该音效算法，正在实时滤波！');
              } else if (e.data.type === 'error') {
                log('❌ AudioWorklet 报错: ' + e.data.error);
                reject(new Error(e.data.error));
              }
            };

            const bufCopy = wasmBinary.slice(0);
            workletNode.port.postMessage({
              type: 'init',
              data: { wasmBinary: bufCopy }
            }, [bufCopy]);
          });

          drawVisualizer();
        }
      })();

      try {
        await initPromise;
      } catch (err) {
        log('❌ AudioWorklet 初始化异常: ' + err.message);
        initPromise = null;
      }
    }

    // 预载 WASM
    async function initResources() {
      if (wasmBinary) return;
      try {
        log('正在载入 byte_audio_tuner_wasm.wasm 二进制核心...');
        const wasmRes = await fetch('../wasm/byte_audio_tuner_wasm.wasm');
        wasmBinary = await wasmRes.arrayBuffer();
        log('✅ WebAssembly DSP 核心文件载入完毕！');
      } catch (err) {
        log('❌ 资源载入失败: ' + err.message);
      }
    }

    // 切换音效
    async function switchEffect(key) {
      currentKey = key;
      document.querySelectorAll('.effect-item').forEach(el => {
        el.classList.toggle('active', el.dataset.key === key);
      });

      const eff = effectList.find(e => e.key === key);
      log(`🔄 切换音效: 【${eff.name}】`);

      await initAudioGraph();

      if (key === 'none' || !PRESETS[key]) {
        if (workletNode) {
          workletNode.port.postMessage({ type: 'setEnabled', data: { enabled: false } });
        }
        rebuildAudioRouting();
        log('   -> 已切换为原声直通模式 (直连声卡)');
        return;
      }

      if (workletNode && workletReady) {
        const configJson = JSON.stringify(PRESETS[key]);
        workletNode.port.postMessage({
          type: 'loadConfig',
          data: { configJson, sampleRate: audioCtx.sampleRate, channels: 2 }
        });
        workletNode.port.postMessage({ type: 'setEnabled', data: { enabled: true } });

        rebuildAudioRouting();
        log(`   ✅ 100% 应用原生 DSP 处理链: ${eff.name}`);
      }
    }

    // 文件上传与播放
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      currentTrackName.textContent = file.name;
      currentTrackName.title = file.name;

      await initAudioGraph();

      if (isSynthPlaying) stopSynth();

      const url = URL.createObjectURL(file);
      audioEl.src = url;
      audioEl.load();

      if (!sourceNode) {
        sourceNode = audioCtx.createMediaElementSource(audioEl);
      }
      rebuildAudioRouting();

      btnPlayPause.disabled = false;
      btnPlayPause.textContent = '⏸ 暂停';
      await audioEl.play();
      log(`🎶 正在播放本地音乐: ${file.name}`);
    };

    btnPlayPause.onclick = async () => {
      await initAudioGraph();
      if (audioEl.paused) {
        await audioEl.play();
        btnPlayPause.textContent = '⏸ 暂停';
      } else {
        audioEl.pause();
        btnPlayPause.textContent = '▶ 播放';
      }
    };

    // 播放合成空间乐段
    btnTone.onclick = async () => {
      await initAudioGraph();
      if (isSynthPlaying) {
        stopSynth();
        return;
      }

      if (!audioEl.paused) audioEl.pause();
      btnPlayPause.textContent = '▶ 播放';

      isSynthPlaying = true;
      btnTone.textContent = '⏹ 停止测试乐段';
      currentTrackName.textContent = '立体声和弦乐段 (Clean C-Major Chord)';

      const freqs = [261.63, 329.63, 392.00, 523.25];
      synthNodes = [];
      const synthGain = audioCtx.createGain();
      synthGain.gain.value = 0.22;

      freqs.forEach((f) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = f;
        osc.connect(synthGain);
        osc.start();
        synthNodes.push(osc);
      });

      sourceNode = synthGain;
      rebuildAudioRouting();
      synthNodes.push(synthGain);

      log('🎹 正在播放空间和弦乐段，可点击上方音效卡片实时对比！');
    };

    function stopSynth() {
      if (!isSynthPlaying) return;
      synthNodes.forEach(node => {
        try { node.stop?.(); node.disconnect(); } catch(e){}
      });
      synthNodes = [];
      isSynthPlaying = false;
      btnTone.textContent = '🎹 播放立体声测试乐段';
      log('⏹ 已停止测试乐段');
    }

    // 播放进度
    audioEl.ontimeupdate = () => {
      if (audioEl.duration) {
        const pct = (audioEl.currentTime / audioEl.duration) * 100;
        progressFill.style.width = pct + '%';
        timeCurrent.textContent = formatTime(audioEl.currentTime);
        timeDuration.textContent = formatTime(audioEl.duration);
      }
    };

    audioEl.onended = () => {
      btnPlayPause.textContent = '▶ 播放';
      progressFill.style.width = '0%';
    };

    progressBar.onclick = (e) => {
      if (audioEl.duration) {
        const rect = progressBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audioEl.currentTime = pos * audioEl.duration;
      }
    };

    function formatTime(s) {
      if (!s || isNaN(s)) return '00:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    // 绘制示波器
    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyserNode) return;

      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyserNode.getByteFrequencyData(dataArray);

      canvasCtx.fillStyle = '#09090b';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.2;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#f59e0b');
        gradient.addColorStop(1, '#38bdf8');
        canvasCtx.fillStyle = gradient;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }

    initResources();
  </script>
</body>
</html>
